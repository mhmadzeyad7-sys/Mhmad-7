name: Build SAAD SPICES APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find SAAD SPICES ZIP
        run: |
          echo "Files in repository:"
          find . -maxdepth 3 -type f -print

          ZIP_FILE=$(find . -type f -iname 'SAAD_SPICES*.zip' | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No SAAD SPICES ZIP file was found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

          echo "Extracted files:"
          find project -maxdepth 3 -type f -print

      - name: Find Android project
        run: |
          SETTINGS=$(find project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAAD-SPICES-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
