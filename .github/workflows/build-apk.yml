name: Build SAAD SPICES APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract project ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name 'SAAD_SPICES_Android_Local.zip' | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "SAAD_SPICES_Android_Local.zip not found in repository root."
            exit 1
          fi
          rm -rf project
          mkdir project
          unzip -q "$ZIP_FILE" -d project
          PROJECT_DIR=$(find project -type f -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project (settings.gradle) not found after extraction."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare APK
        run: cp "${PROJECT_DIR}/app/build/outputs/apk/debug/app-debug.apk" SAAD-SPICES.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAAD-SPICES-APK
          path: SAAD-SPICES.apk
          if-no-files-found: error
          retention-days: 30
